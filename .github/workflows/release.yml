name: Desktop build, test and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  RUST_VERSION: '1.99.0'
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
          - runner: windows-2022
            platform: windows
            arch: x86_64
          - runner: macos-15
            platform: macos
            arch: universal
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap verified official Flutter revision
        run: python scripts/setup_flutter.py --directory "${{ runner.temp }}/flutter-sdk"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.platform }}-${{ matrix.arch }}
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-14-dev xvfb xauth dbus-x11 openbox xdotool fonts-noto-cjk fonts-noto-color-emoji
      - name: Install macOS Rust targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { choco install innosetup --no-progress -y }
      - name: Validate release metadata
        shell: bash
        run: |
          python scripts/check_release.py
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python scripts/check_release.py --tag "$GITHUB_REF_NAME"
          fi
      - name: Resolve locked dependencies
        run: |
          flutter pub get --enforce-lockfile
          cargo fetch --manifest-path rust/Cargo.toml --locked
      - name: Check formatting and analysis
        shell: bash
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze --fatal-infos
          cargo fmt --manifest-path rust/Cargo.toml -- --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings
      - name: Run unit and core tests
        shell: bash
        run: |
          cargo build --manifest-path rust/Cargo.toml --locked
          flutter test
          cargo test --manifest-path rust/Cargo.toml --locked
          python -m unittest discover -s scripts/tests -v
      - name: Exercise Linux desktop integration
        if: matrix.platform == 'linux'
        run: scripts/test_desktop.sh
      - name: Build and package native desktop
        run: python scripts/package.py
      - name: Verify macOS native application contract
        if: matrix.platform == 'macos'
        run: >-
          xcodebuild test -workspace macos/Runner.xcworkspace -scheme Runner
          -destination 'platform=macOS' -derivedDataPath build/macos
          -only-testing:RunnerTests
      - name: Verify Linux native library linkage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cpu=x64
          if [[ '${{ matrix.arch }}' == aarch64 ]]; then cpu=arm64; fi
          bundle="build/linux/$cpu/release/bundle"
          ldd "$bundle/doomedlauncher"
          ldd "$bundle/lib/libdoomedlauncher_core.so"
          test -f "$bundle/lib/libflutter_linux_gtk.so"
          "$bundle/doomedlauncher" --version
          "$bundle/doomedlauncher" --help
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap verified official Flutter revision
        run: python scripts/setup_flutter.py --directory "${{ runner.temp }}/flutter-sdk"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install Flatpak SDK and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils xvfb xauth dbus dbus-x11 xdotool
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//49 org.gnome.Sdk//49 org.freedesktop.Sdk.Extension.rust-stable//25.08 org.freedesktop.Sdk.Extension.llvm20//25.08
      - name: Build inside the runtime and package
        run: bash scripts/package_flatpak.sh
      - name: Validate bundle installation
        run: |
          dbus-run-session -- flatpak install --user --noninteractive --reinstall dist/*.flatpak
          flatpak info --user com.goshapps.DoomLauncher
          dbus-run-session -- flatpak run com.goshapps.DoomLauncher --version
      - name: Smoke-test installed Flatpak desktop startup
        run: dbus-run-session -- xvfb-run -a bash scripts/verify_flatpak_runtime.sh
      - name: Verify installed Flatpak host process bridge
        run: >-
          dbus-run-session -- flatpak run --command=flatpak-spawn
          com.goshapps.DoomLauncher --host /usr/bin/true
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [desktop, flatpak]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: flatpak-*
          path: dist
          merge-multiple: true
      - name: Verify complete artifact matrix and checksums
        run: python3 scripts/verify_artifacts.py --tag "$GITHUB_REF_NAME"
      - name: Extract release notes
        run: python3 scripts/check_release.py --tag "$GITHUB_REF_NAME" --notes build-release-notes.md
      - name: Publish only the validated tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "Doom Launcher ${GITHUB_REF_NAME#v}" \
            --notes-file build-release-notes.md "${prerelease[@]}"
