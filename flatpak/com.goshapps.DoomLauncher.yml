id: com.goshapps.DoomLauncher
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
branch: stable
command: doomedlauncher
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  # Launch host source ports (native binaries, Flatpak and snap wrappers).
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: doomedlauncher
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=ON
    run-tests: true
    test-rule: ""
    test-commands:
      - QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software ctest --output-on-failure
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .flatpak-builder
          - build
          - build-flatpak
          - repo
          - dist
    post-install:
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/com.goshapps.DoomLauncher/LICENSE
