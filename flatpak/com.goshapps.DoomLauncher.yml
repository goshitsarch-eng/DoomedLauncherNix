id: com.goshapps.DoomLauncher
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
branch: stable
command: doomedlauncher
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  # Launch host source ports (native binaries, Flatpak and snap wrappers).
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: doomedlauncher
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ..
    post-install:
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/com.goshapps.DoomLauncher/LICENSE
