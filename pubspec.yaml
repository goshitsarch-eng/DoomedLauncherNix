name: doomedlauncher
description: Cross-platform Doom library and source port launcher.
publish_to: none
version: 5.0.0-alpha.1+50000
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4
  path: ^1.9.1
  path_provider: ^2.1.5
  file_selector: ^1.0.4
  url_launcher: ^6.3.2
  window_manager: ^0.5.1
  desktop_drop: ^0.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  url_launcher_platform_interface: ^2.3.2
flutter:
  uses-material-design: true
  assets:
    - data/com.goshapps.DoomLauncher.png
